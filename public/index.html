<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PantryPal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Pantry<span>Pal</span></h1>
        <p class="tag">Cook what you already have, starting with what will expire first.</p>
      </div>
      <div class="who"><small>Signed in</small><div class="account"><span id="identity"></span><button id="logout" class="person" type="button">Sign out</button></div></div>
    </div>
    <nav id="tabs">
      <button data-tab="cook" class="active">Cook tonight</button>
      <button data-tab="pantry">My pantry</button>
      <button data-tab="reports">SQL reports</button>
      <button data-tab="mongo">MongoDB reports</button>
    </nav>
  </div>
</header>
<main>
  <section id="tab-cook"></section>
  <section id="tab-pantry" hidden></section>
  <section id="tab-reports" hidden></section>
  <section id="tab-mongo" hidden></section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="/app.js" defer></script>
</body>
</html>

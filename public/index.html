<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PantryPal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2ec; --card: #ffffff; --ink: #14231c; --muted: #5d6b63; --line: #dde4da;
    --leaf: #1d6b46; --leaf-deep: #0f3d28; --leaf-soft: #e1f0e6; --lime: #cfe86a;
    --tomato: #d4402b; --tomato-soft: #fde8e3; --butter: #e9a425; --butter-soft: #fcf0d2;
    --head: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--body); background: var(--bg); color: var(--ink); line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }

  /* masthead */
  header { background: var(--leaf-deep); color: #fff; padding: 26px 24px 0; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-bottom: 22px; }
  header h1 { margin: 0; font: 800 clamp(34px, 6vw, 52px)/1 var(--head); letter-spacing: -1.5px; }
  header h1 span { color: var(--lime); }
  header .tag { margin: 8px 0 0; color: #b9d3c3; font-size: 15px; max-width: 420px; }
  .who { display: flex; flex-direction: column; gap: 6px; }
  .who small { color: #b9d3c3; font-size: 12.5px; }
  .people { display: flex; gap: 6px; background: rgba(255,255,255,.09); padding: 5px; border-radius: 40px; flex-wrap: wrap; }
  .person { border: 0; background: none; color: #dcebe1; font: 500 14px var(--body); padding: 6px 14px 6px 6px;
            border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .person i { width: 28px; height: 28px; border-radius: 50%; background: #2c5d45; display: grid; place-items: center;
              font: 700 12px var(--head); font-style: normal; color: #fff; }
  .person.on { background: var(--lime); color: var(--leaf-deep); font-weight: 600; }
  .person.on i { background: var(--leaf-deep); color: var(--lime); }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button { border: 0; background: none; padding: 12px 18px; font: 600 14.5px var(--body); cursor: pointer; color: #9fbfab;
               border-radius: 12px 12px 0 0; white-space: nowrap; }
  nav button:hover { color: #fff; }
  nav button.active { background: var(--bg); color: var(--leaf-deep); }

  main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 70px; }
  h2 { font: 800 28px/1.15 var(--head); letter-spacing: -.6px; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 22px; max-width: 640px; }
  .sub.small { font-size: 13px; margin-top: 18px; }

  /* formula strip */
  .explain { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--card); border: 1px solid var(--line);
             border-radius: 14px; padding: 12px 16px; font-size: 14px; color: var(--muted); margin-bottom: 24px; }
  .explain code { background: var(--leaf-soft); color: var(--leaf-deep); padding: 4px 10px; border-radius: 8px; font: 600 14px var(--body); }

  /* recipe cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; }
  .card h3 { margin: 0; font: 700 20px/1.2 var(--head); letter-spacing: -.3px; }
  .head { display: flex; align-items: flex-start; gap: 14px; justify-content: space-between; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
  .meta span { background: #f1f4ef; color: var(--muted); font-size: 12.5px; padding: 3px 10px; border-radius: 20px; }
  .meta span.veg { background: var(--leaf-soft); color: var(--leaf); }
  .ring { --p: 0; flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
          background: conic-gradient(var(--leaf) calc(var(--p) * 1%), var(--line) 0); }
  .ring b { width: 44px; height: 44px; border-radius: 50%; background: var(--card); display: grid; place-items: center;
            font: 800 15px var(--head); color: var(--leaf-deep); }
  .lbl { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .lbl b { color: var(--ink); font-weight: 600; }
  .bar { height: 9px; background: #edf1ea; border-radius: 6px; overflow: hidden; margin: 4px 0 12px; }
  .bar > i { display: block; height: 100%; border-radius: 6px; transition: width .6s ease; }
  .btns { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
  button.act { flex: 1; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--leaf); background: var(--leaf);
               color: #fff; font: 600 13.5px var(--body); cursor: pointer; transition: background .15s; }
  button.act.alt { background: transparent; color: var(--leaf); }
  button.act:hover { background: var(--leaf-deep); border-color: var(--leaf-deep); color: #fff; }
  .shop { margin: 4px 0 12px; font-size: 13.5px; background: var(--butter-soft); border-radius: 12px; padding: 10px 12px; }
  .shop.ok { background: var(--leaf-soft); }
  .shop b { display: block; margin-bottom: 4px; }
  .shop ul { margin: 0; padding-left: 18px; }

  /* the top pick */
  .hero { grid-column: 1 / -1; background: var(--leaf-deep); color: #fff; border: 0; padding: 28px; display: grid;
          grid-template-columns: 1.2fr 1fr; gap: 26px; }
  .hero h3 { font-size: clamp(26px, 4vw, 38px); letter-spacing: -1px; }
  .hero .badge { display: inline-block; background: var(--lime); color: var(--leaf-deep); font: 700 12.5px var(--body);
                 padding: 3px 12px; border-radius: 20px; margin-bottom: 12px; }
  .hero .meta span { background: rgba(255,255,255,.12); color: #d4e6da; }
  .hero .ring { width: 84px; height: 84px; background: conic-gradient(var(--lime) calc(var(--p) * 1%), rgba(255,255,255,.18) 0); }
  .hero .ring b { width: 66px; height: 66px; background: var(--leaf-deep); color: var(--lime); font-size: 22px; }
  .hero .lbl, .hero .lbl b { color: #d4e6da; }
  .hero .bar { background: rgba(255,255,255,.16); }
  .hero button.act { background: var(--lime); border-color: var(--lime); color: var(--leaf-deep); }
  .hero button.act.alt { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
  .hero button.act:hover { background: #fff; border-color: #fff; color: var(--leaf-deep); }
  .hero .shop { color: var(--ink); }
  .hero .side { display: flex; flex-direction: column; justify-content: center; }

  /* pantry lanes */
  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; align-items: start; }
  .lane { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; border-top: 6px solid var(--leaf); }
  .lane.urgent { border-top-color: var(--tomato); } .lane.soon { border-top-color: var(--butter); }
  .lane h3 { margin: 0; font: 700 18px var(--head); }
  .lane p { margin: 2px 0 14px; color: var(--muted); font-size: 13px; }
  .items { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 10px; font-size: 14px; background: var(--leaf-soft); }
  .chip b { font-weight: 600; }
  .chip em { font: 700 12px var(--body); font-style: normal; background: var(--leaf); color: #fff; padding: 2px 8px; border-radius: 7px; }
  .urgent .chip { background: var(--tomato-soft); } .urgent .chip em { background: var(--tomato); }
  .soon .chip { background: var(--butter-soft); } .soon .chip em { background: var(--butter); color: #3b2a05; }
  .empty { color: var(--muted); font-size: 13.5px; }

  /* reports */
  .reps { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 18px; }
  .rep { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 8px; overflow-x: auto; }
  .rep h3 { margin: 0 0 10px; font: 700 16.5px var(--head); display: flex; gap: 10px; align-items: center; }
  .rep h3 span { background: var(--leaf-deep); color: var(--lime); font-size: 12px; padding: 2px 9px; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; color: var(--muted); font: 600 12.5px var(--body); padding: 6px 10px; border-bottom: 2px solid var(--line); text-transform: capitalize; }
  td { padding: 9px 10px; border-bottom: 1px solid #eef1ec; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #f7faf6; }
  td.num { text-align: right; } th.num { text-align: right; }

  .note { background: var(--butter-soft); border-radius: 14px; padding: 16px 18px; font-size: 14.5px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: #fff;
           padding: 13px 20px; border-radius: 14px; font-size: 14.5px; opacity: 0; pointer-events: none; max-width: 90%;
           box-shadow: 0 10px 30px rgba(0,0,0,.3); transition: .25s; border-left: 5px solid var(--lime); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 720px) { .hero { grid-template-columns: 1fr; } .reps { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Pantry<span>Pal</span></h1>
        <p class="tag">Cook what you already have, starting with what will expire first.</p>
      </div>
      <div class="who"><small>Cooking as</small><div class="people" id="people"></div></div>
    </div>
    <nav id="tabs">
      <button data-tab="cook" class="active">Cook tonight</button>
      <button data-tab="pantry">My pantry</button>
      <button data-tab="reports">SQL reports</button>
      <button data-tab="mongo">MongoDB reports</button>
    </nav>
  </div>
</header>
<main>
  <section id="tab-cook"></section>
  <section id="tab-pantry" hidden></section>
  <section id="tab-reports" hidden></section>
  <section id="tab-mongo" hidden></section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const api = (url, opts) => fetch(url, opts).then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error || "Request failed"); return j; });

let currentUser = null;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 4500);
}

// ---------- tabs ----------
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("active", x === b));
  ["cook", "pantry", "reports", "mongo"].forEach((t) => ($("#tab-" + t).hidden = t !== b.dataset.tab));
  load(b.dataset.tab);
});
const activeTab = () => document.querySelector("#tabs button.active").dataset.tab;

function load(tab) {
  if (tab === "cook") return loadCook();
  if (tab === "pantry") return loadPantry();
  if (tab === "reports") return loadReports();
  if (tab === "mongo") return loadMongo();
}

// ---------- cook tonight (the novelty feature) ----------
async function loadCook() {
  const box = $("#tab-cook"); box.replaceChildren(el("p", "sub", "Ranking recipes..."));
  const data = await api("/api/rank/" + currentUser);
  box.replaceChildren();
  box.append(el("h2", null, "What should I cook tonight?"));
  box.append(el("p", "sub", "Recipes ranked by how much you already have, and how soon those ingredients expire."));
  const ex = el("div", "explain");
  ex.innerHTML = "<code>Score = 0.7 x coverage + 0.3 x urgency</code><span>Coverage is the share of ingredients in your pantry. Urgency rises as their shelf life runs out.</span>";
  box.append(ex);
  if (!data.recipes.length) { box.append(el("div", "note", "No recipe matches this pantry yet. Add items to your pantry to see suggestions.")); return; }

  const grid = el("div", "grid"); box.append(grid);
  data.recipes.forEach((r, i) => {
    const top = i === 0;
    const c = el("div", "card" + (top ? " hero" : ""));
    const main = el("div", top ? "side" : null); if (!top) main.style.display = "contents";

    const head = el("div", "head");
    const titleBox = el("div");
    if (top) titleBox.append(el("span", "badge", "Top pick for you"));
    titleBox.append(el("h3", null, r.title));
    const ring = el("div", "ring"); ring.style.setProperty("--p", Math.round(r.score * 100));
    ring.title = "Score " + r.score.toFixed(2); ring.append(el("b", null, r.score.toFixed(2)));
    head.append(titleBox, ring);

    const meta = el("div", "meta");
    [r.cuisine, r.diet_type, r.prep_minutes + " min", r.calories + " kcal", "cooked " + r.times_cooked + "x"]
      .forEach((m) => meta.append(el("span", m === "veg" || m === "vegan" ? "veg" : "", m)));
    main.append(head, meta);

    const bars = [["Coverage", r.coverage, `${r.have_cnt} of ${r.need_cnt} ingredients`, "var(--leaf)"],
                  ["Expiry urgency", r.urgency, r.urgency >= 0.35 ? "use soon" : "relaxed", "var(--butter)"]];
    if (top) { bars[0][3] = "var(--lime)"; }
    const barBox = el("div");
    bars.forEach(([name, val, txt, col]) => {
      const l = el("div", "lbl"); l.append(el("b", null, name), el("span", null, txt)); barBox.append(l);
      const b = el("div", "bar"); const f = document.createElement("i");
      f.style.width = "0%"; f.style.background = col; b.append(f); barBox.append(b);
      requestAnimationFrame(() => requestAnimationFrame(() => (f.style.width = Math.round(val * 100) + "%")));
    });

    const shop = el("div", "shop"); shop.hidden = true;
    const row = el("div", "btns");
    const b1 = el("button", "act alt", "What am I missing?");
    b1.onclick = async () => {
      const m = await api(`/api/missing/${currentUser}/${r.recipe_id}`);
      shop.hidden = false; shop.classList.toggle("ok", !m.length); shop.replaceChildren();
      if (!m.length) { shop.textContent = "You have everything you need."; return; }
      shop.append(el("b", null, "Shopping list"));
      const ul = el("ul"); m.forEach((x) => ul.append(el("li", null, `${x.ingredient} (${x.quantity})`))); shop.append(ul);
    };
    const b2 = el("button", "act", "Add to tomorrow's plan");
    b2.onclick = async () => {
      try {
        const p = await api("/api/plan", { method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ user_id: currentUser, recipe_id: r.recipe_id }) });
        toast(`Added ${p.title}. Trigger fired: times_cooked ${p.before} -> ${p.after}`);
        loadCook();
      } catch (e) { toast("Could not add: " + e.message); }
    };
    row.append(b1, b2);
    if (top) { const side = el("div", "side"); side.append(barBox, shop, row); c.append(main, side); }
    else { c.append(main, barBox, shop, row); }
    grid.append(c);
  });
  if (data.loggedToMongo) box.append(el("p", "sub small", "This search was saved to MongoDB (search_logs)."));
}

// ---------- pantry ----------
async function loadPantry() {
  const box = $("#tab-pantry"); box.replaceChildren();
  const rows = await api("/api/pantry/" + currentUser);
  box.append(el("h2", null, "My pantry"));
  box.append(el("p", "sub", "Everything you have, grouped by how soon it needs to be used. Days left = shelf life minus days since purchase."));
  const lanes = [["urgent", "Use today", "1 day left or already expired", (d) => d <= 1],
                 ["soon", "Use this week", "2 to 3 days left", (d) => d > 1 && d <= 3],
                 ["fresh", "Plenty of time", "More than 3 days left", (d) => d > 3]];
  const wrap = el("div", "lanes"); box.append(wrap);
  lanes.forEach(([cls, title, hint, test]) => {
    const l = el("div", "lane " + cls); l.append(el("h3", null, title), el("p", null, hint));
    const items = el("div", "items"); const mine = rows.filter((r) => test(r.days_left));
    mine.forEach((r) => {
      const d = r.days_left;
      const label = d < 0 ? "expired" : d > 60 ? "long life" : d + (d === 1 ? " day" : " days");
      const c = el("div", "chip"); c.append(el("b", null, r.ingredient), el("em", null, label)); items.append(c);
    });
    if (!mine.length) items.append(el("span", "empty", "Nothing here."));
    l.append(items); wrap.append(l);
  });
}

// ---------- SQL reports ----------
function renderTable(columns, rows) {
  const t = el("table"); const thead = el("thead"), h = el("tr");
  const isNum = (c) => rows.length && rows.every((r) => r[c] !== null && r[c] !== "" && !isNaN(Number(r[c])));
  columns.forEach((c) => h.append(el("th", isNum(c) ? "num" : "", c.replace(/_/g, " ")))); thead.append(h); t.append(thead);
  const tb = el("tbody");
  rows.forEach((r) => { const tr = el("tr"); columns.forEach((c) => tr.append(el("td", isNum(c) ? "num" : "", r[c] ?? ""))); tb.append(tr); });
  t.append(tb); return t;
}
function reportCard(tag, title, content) {
  const d = el("div", "rep"); const h = el("h3"); h.append(el("span", null, tag), document.createTextNode(title));
  d.append(h, content); return d;
}
async function loadReports() {
  const box = $("#tab-reports"); box.replaceChildren(el("p", "sub", "Loading..."));
  const reps = await api("/api/reports");
  box.replaceChildren(el("h2", null, "PostgreSQL reports"), el("p", "sub", "Live GROUP BY and JOIN queries on the relational data."));
  const g = el("div", "reps"); box.append(g);
  reps.forEach((r, i) => g.append(reportCard("R" + (i + 1), r.title, renderTable(r.columns, r.rows))));
}

// ---------- Mongo reports ----------
async function loadMongo() {
  const box = $("#tab-mongo"); box.replaceChildren(el("p", "sub", "Loading..."));
  const m = await api("/api/mongo");
  box.replaceChildren(el("h2", null, "MongoDB reports"), el("p", "sub", "Aggregation pipelines on search_logs and cooking_journal."));
  if (!m.available) {
    box.append(el("div", "note", "MongoDB is not running, so this tab is empty. Start MongoDB, run mongo_setup.js once, and refresh. The rest of the app works without it."));
    return;
  }
  const g = el("div", "reps"); box.append(g);
  m.reports.forEach((r, i) => g.append(reportCard("M" + (i + 1), r.title,
    r.rows.length ? renderTable(Object.keys(r.rows[0]), r.rows) : el("div", "empty", "No data yet."))));
}

// ---------- start ----------
(async () => {
  try {
    const users = await api("/api/users");
    const people = $("#people");
    const init = (n) => n.split(" ").map((w) => w[0]).join("").slice(0, 2);
    users.forEach((u, i) => {
      const b = el("button", "person" + (i === 0 ? " on" : ""));
      b.append(el("i", null, init(u.name)), document.createTextNode(`${u.name} (${u.diet_pref})`));
      b.onclick = () => {
        currentUser = u.user_id;
        people.querySelectorAll(".person").forEach((x) => x.classList.toggle("on", x === b));
        load(activeTab());
      };
      people.append(b);
    });
    currentUser = users[0].user_id;
    loadCook();
  } catch (e) {
    $("#tab-cook").replaceChildren(el("div", "note", "Could not reach the database: " + e.message +
      ". Check that PostgreSQL is running and that you ran schema.sql and seed.sql."));
  }
})();
</script>
</body>
</html>
